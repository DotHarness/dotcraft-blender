name: Build and publish Blender

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check the Blender add-on
        shell: pwsh
        run: |
          python -m compileall -q bridge scripts
          if ($LASTEXITCODE) { throw 'Bridge sources do not compile.' }

      - name: Build and verify the plugin bundle
        shell: pwsh
        run: ./scripts/build.ps1 -OutputDirectory .artifacts/release

      - name: Check the staging script against the marketplace
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/DotHarness/dotcraft-plugins.git .artifacts/marketplace
          if ($LASTEXITCODE) { throw 'Could not read the marketplace repository.' }
          ./scripts/sync-marketplace.ps1 -ArtifactDirectory .artifacts/release -MarketplaceRoot .artifacts/marketplace

      - uses: actions/upload-artifact@v4
        with:
          name: blender-release-candidate
          path: .artifacts/release/
          include-hidden-files: true

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: blender-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: blender-release-candidate
          path: artifacts/release

      - name: Verify release candidate
        id: candidate
        shell: pwsh
        run: |
          ./scripts/verify-package.ps1 -ArtifactDirectory artifacts/release
          $manifest = Get-Content artifacts/release/release-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -cne '${{ github.sha }}' -or $manifest.sourceDirty -ne $false) {
            throw 'Release candidate must be a clean build of this commit.'
          }
          if ('v' + $manifest.version -cne '${{ github.ref_name }}') {
            throw 'Release tag must match the plugin manifest version.'
          }
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT

      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          owner: DotHarness
          repositories: dotcraft-plugins

      - uses: actions/checkout@v6
        with:
          repository: DotHarness/dotcraft-plugins
          token: ${{ steps.app.outputs.token }}
          path: marketplace

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage the plugin into the marketplace
        shell: pwsh
        run: ./scripts/sync-marketplace.ps1 -ArtifactDirectory artifacts/release -MarketplaceRoot marketplace

      - uses: peter-evans/create-pull-request@v7
        with:
          path: marketplace
          token: ${{ steps.app.outputs.token }}
          branch: updates/blender-${{ steps.candidate.outputs.version }}
          commit-message: Update blender to ${{ steps.candidate.outputs.version }}
          title: Update blender to ${{ steps.candidate.outputs.version }}
          body: |
            Blender plugin bundle, add-on, skill and release provenance from the verified
            dotcraft-blender release. Maintainer review and merge are required.
          add-paths: |
            plugins/blender/**
            .craft/plugins/marketplace.json
